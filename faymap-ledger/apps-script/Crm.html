<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>훼이맵 고객관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface-2:#F6F1E8;
  --text:#24212C; --muted:#6B6472; --border:#E6DDCF;
  --navy:#1D2147; --navy-ink:#F4EFE6;
  --gold:#A9843F; --gold-btn:#E9C46A; --gold-btn-ink:#2A2310; --gold-soft:#F3E6C4;
  --in:#2E8B62; --in-soft:#E3F2EA; --out:#D4553A; --out-soft:#FBE7E2;
  --amber:#D99A3E; --amber-2:#F2C879;
  --shadow:0 6px 20px rgba(29,33,71,.07);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11122A; --surface:#1C1E3D; --surface-2:#24274A;
    --text:#EEE8DC; --muted:#A9A3B9; --border:#31345C;
    --navy:#0B0C1E; --gold:#D6B66F; --gold-btn:#D9B25A; --gold-soft:#3B3424;
    --in:#56C08F; --in-soft:#17352B; --out:#EE7A5E; --out-soft:#3D2125;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11122A; --surface:#1C1E3D; --surface-2:#24274A;
  --text:#EEE8DC; --muted:#A9A3B9; --border:#31345C;
  --navy:#0B0C1E; --gold:#D6B66F; --gold-btn:#D9B25A; --gold-soft:#3B3424;
  --in:#56C08F; --in-soft:#17352B; --out:#EE7A5E; --out-soft:#3D2125;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 헤더 · 탭 */
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;z-index:10}
.top-in{max-width:760px;margin:0 auto;padding:14px 16px 0}
.top-row{display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-family:'Noto Serif KR',serif;font-weight:900;font-size:20px;letter-spacing:-.02em;flex:1}
.switch{flex:none;color:var(--navy-ink);text-decoration:none;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px}
.switch:hover{background:rgba(255,255,255,.1)}
.top h1 em{font-style:normal;color:var(--gold-btn)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;color:var(--navy-ink);opacity:.7;padding:10px 4px 12px;font-weight:700;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold-btn)}
.tabs .cnt{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--gold-btn);color:var(--gold-btn-ink);font-size:11px;line-height:18px}
.demo{background:var(--gold-btn);color:var(--gold-btn-ink);font-size:12px;font-weight:700;text-align:center;padding:5px 12px}

main{max-width:760px;margin:0 auto;padding:14px 16px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:500;font-size:12.5px;color:var(--muted)}
.card h2 .right{margin-left:auto}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;color:var(--muted);padding:16px 0;font-size:13.5px}
.hide{display:none!important}

/* 지표 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.tile small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.tile b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;margin-top:2px}

/* 목록 */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;border-radius:0}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--surface-2)}
.sym{flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold-btn);display:flex;align-items:center;justify-content:center;font-size:18px}
.sym.none{background:var(--surface-2);color:var(--muted);font-size:14px}
.body{flex:1;min-width:0}
.body b{font-weight:700}
.body small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.side{flex:none;text-align:right;font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--gold-soft);color:var(--gold)}
.tag.ing{background:var(--surface-2);color:var(--text)}
.tag.buy{background:var(--in-soft);color:var(--in)}
.tag.warn{background:var(--out-soft);color:var(--out)}

/* 문의 카드 */
.inq{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px}
.inq:first-child{margin-top:0}
.inq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inq-top b{font-size:15px}
.inq-top .at{margin-left:auto;font-size:12px;color:var(--muted)}
.inq p{margin:6px 0 0;font-size:13.5px;white-space:pre-wrap}
.inq .note{background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--muted)}
.inq-act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* 입력 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid .wide{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11.5px;color:var(--muted);font-weight:500;padding-left:2px}
input,select,textarea{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .06s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold-btn);color:var(--gold-btn-ink)}
.btn.navy{background:var(--navy);color:var(--navy-ink)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{margin-bottom:10px}

/* 별자리 미리보기 */
.zodiac{display:flex;align-items:center;gap:12px;background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:12px 14px}
.zodiac .big{font-size:28px;color:var(--gold-btn);line-height:1}
.zodiac b{display:block;font-size:15px}
.zodiac small{font-size:12.5px;opacity:.85}
.zodiac.off{background:var(--surface-2);color:var(--muted)}
.zodiac.off .big{color:var(--muted)}
.zodiac.warn{background:var(--out-soft);color:var(--out)}
.zodiac.warn .big{color:var(--out)}

/* 막대 */
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:10px;font-size:13px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--amber-2))}
.hbar .n{text-align:right;font-weight:700}

/* 고객 창 */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--bg);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(17,18,42,.55)}
.dlg-head{position:sticky;top:0;background:var(--navy);color:var(--navy-ink);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:1}
.dlg-head h3{margin:0;font-size:17px;flex:1}
.dlg-head .x{border:0;background:none;color:var(--navy-ink);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
.dlg-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.sec{background:var(--surface);border-radius:14px;padding:14px}
.sec h4{margin:0 0 10px;font-size:14px}
.buys{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.buys li{padding:6px 0;border-bottom:1px solid var(--border)}
.buys li:last-child{border-bottom:0}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:var(--navy-ink);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;transition:.25s;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.loading{text-align:center;color:var(--muted);padding:40px 0}

@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .grid .wide{grid-column:auto}
  .hbar{grid-template-columns:92px 1fr 24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row"><h1>훼이맵 <em>고객관리</em></h1><a class="switch" id="toLedger" href="Index.html" target="_top">장부로 →</a></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="home" aria-selected="true">홈</button>
      <button role="tab" data-tab="cust" aria-selected="false">고객</button>
      <button role="tab" data-tab="inq" aria-selected="false">문의<span class="cnt hide" id="newCnt"></span></button>
      <button role="tab" data-tab="set" aria-selected="false">설정</button>
    </nav>
  </div>
</header>
<div class="demo hide" id="demoBar">미리보기(데모 데이터) — 구글 시트에 연결하면 실제 고객이 보입니다</div>
<main id="main"><div class="loading">불러오는 중…</div></main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head"><h3 id="dlgTitle">고객</h3><button class="x" type="button" data-close aria-label="닫기">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 별자리 표 — Code.gs의 ZODIAC과 같습니다(화면 미리보기용).
const ZODIAC = [
  ['염소자리', '♑', 119, '시더우드', '굳건·기반'], ['물병자리', '♒', 218, '유칼립투스', '통찰·확장'],
  ['물고기자리', '♓', 320, '프랑킨센스', '영성·보호'], ['양자리', '♈', 419, '로즈마리', '열정·용기'],
  ['황소자리', '♉', 520, '일랑일랑', '여유·향유'], ['쌍둥이자리', '♊', 621, '페퍼민트', '환기·호기심'],
  ['게자리', '♋', 722, '스위트 마조람', '위로·포용'], ['사자자리', '♌', 822, '스위트 오렌지', '관용·온기'],
  ['처녀자리', '♍', 922, '라벤더', '이완·평온'], ['천칭자리', '♎', 1022, '제라늄', '균형·사랑'],
  ['전갈자리', '♏', 1121, '파출리', '심연·몰입'], ['사수자리', '♐', 1221, '주니퍼베리', '정화·도약']
];
const ZODIAC_ORDER = ['양자리', '황소자리', '쌍둥이자리', '게자리', '사자자리', '처녀자리', '천칭자리', '전갈자리', '사수자리', '염소자리', '물병자리', '물고기자리'];
const NEED_SOLAR = '양력 생일 확인 필요';
const STATUSES = ['신규 문의', '상담중', '구매 고객', '휴면'];
const INQ_STATES = ['새 문의', '연락함', '완료'];
const SOURCES = ['인스타그램', '스레드', '네이버 블로그', '유튜브', '스마트스토어', '와디즈', '지인 소개', '기타'];

const S = { d: null, tab: 'home', q: '', status: '전체', inqState: '새 문의', demo: typeof google === 'undefined' || !google.script };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function api(fn, ...args) {
  if (S.demo) return Promise.resolve().then(() => DEMO[fn](...args));
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800); }
function fail(e) { toast((e && e.message) || String(e)); }

// ---------- 날짜 · 별자리 ----------
function zodiacOf(ymd) {
  if (!ymd) return null;
  const md = Number(ymd.slice(5, 7)) * 100 + Number(ymd.slice(8, 10));
  return ZODIAC.find((z) => md <= z[2]) || ZODIAC[0];
}
const symOf = (sign) => (ZODIAC.find((z) => z[0] === sign) || [])[1] || '';
const dnum = (ymd) => Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)) / 864e5;
const daysAgo = (ymd) => ymd ? dnum(S.d.today) - dnum(ymd) : Infinity;
/** 오늘부터 다음 생일까지 남은 날 수 */
function daysToBirthday(ymd) {
  const t = S.d.today, y = +t.slice(0, 4);
  let next = y + ymd.slice(4);
  if (ymd.slice(5) === '02-29' && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) next = y + '-02-28';
  let n = dnum(next) - dnum(t);
  if (n < 0) n += (dnum((y + 1) + ymd.slice(4).replace('02-29', '02-28')) - dnum(next));
  return n;
}
function statusTag(s) {
  const cls = { '신규 문의': 'new', '상담중': 'ing', '구매 고객': 'buy' }[s] || '';
  return `<span class="tag ${cls}">${esc(s || '—')}</span>`;
}
const custById = (id) => S.d.customers.find((c) => c.id === id);

// ---------- 그리기 ----------
function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const n = S.d.inquiries.filter((q) => q.state === '새 문의').length;
  $('newCnt').textContent = n; $('newCnt').classList.toggle('hide', !n);
  $('main').innerHTML = { home: homeView, cust: custView, inq: inqView, set: setView }[S.tab]();
  if (S.tab === 'cust') { const s = $('q'); if (s && document.activeElement !== s && S._focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
}

function custItem(c, side) {
  const sym = symOf(c.sign);
  return `<button class="item" type="button" data-cust="${esc(c.id)}">
    <span class="sym ${sym ? '' : 'none'}">${sym || '?'}</span>
    <span class="body"><b>${esc(c.name)}</b> ${statusTag(c.status)}
      <small>${c.sign && c.sign !== NEED_SOLAR ? esc(c.sign + ' · ' + c.oil) : c.sign === NEED_SOLAR ? '음력 생일 · 양력 확인 필요' : '생일 미입력'}${c.tel ? ' · ' + esc(c.tel) : ''}</small></span>
    <span class="side">${side || ''}</span></button>`;
}

function homeView() {
  const C = S.d.customers, Q = S.d.inquiries;
  const newQ = Q.filter((q) => q.state === '새 문의').sort((a, b) => b.at.localeCompare(a.at));
  const month = S.d.today.slice(5, 7);
  const bdays = C.filter((c) => c.birth).map((c) => ({ c, n: daysToBirthday(c.birth) })).filter((x) => x.n <= 30).sort((a, b) => a.n - b.n);
  const monthB = C.filter((c) => c.birth && c.birth.slice(5, 7) === month).length;
  const rebuy = C.filter((c) => { const n = daysAgo(c.lastBuy); return n >= 60 && n <= 120; }).sort((a, b) => a.lastBuy.localeCompare(b.lastBuy));
  const solar = C.filter((c) => c.sign === NEED_SOLAR);
  const expired = C.filter((c) => daysAgo(c.last || c.first) > 365).sort((a, b) => (a.last || '').localeCompare(b.last || ''));
  const counts = ZODIAC_ORDER.map((name) => ({ name, n: C.filter((c) => c.sign === name).length }));
  const maxN = Math.max(1, ...counts.map((x) => x.n));

  return `
  <div class="tiles num">
    <div class="tile"><small>전체 고객</small><b>${C.length}</b></div>
    <div class="tile"><small>새 문의</small><b>${newQ.length}</b></div>
    <div class="tile"><small>이번 달 생일</small><b>${monthB}</b></div>
    <div class="tile"><small>구매 고객</small><b>${C.filter((c) => c.status === '구매 고객').length}</b></div>
  </div>

  <section class="card"><h2>새 문의 <span class="sub">연락하면 '연락함'을 눌러 주세요</span></h2>
    ${newQ.length ? newQ.slice(0, 5).map(inqCard).join('') : '<div class="empty">새 문의가 없어요</div>'}
    ${newQ.length > 5 ? `<p class="hint">그 밖에 ${newQ.length - 5}건은 [문의] 탭에 있어요.</p>` : ''}
  </section>

  <section class="card"><h2>다가오는 생일 <span class="sub">30일 안 · 별자리 오일로 축하 메시지를 보내 보세요</span></h2>
    <div class="list">${bdays.length ? bdays.map((x) => custItem(x.c, `<b>${x.n === 0 ? '오늘' : 'D-' + x.n}</b><br>${esc(x.c.birth.slice(5).replace('-', '/'))}`)).join('') : '<div class="empty">30일 안에 생일인 고객이 없어요</div>'}</div>
  </section>

  <section class="card"><h2>다시 연락해 볼 고객 <span class="sub">마지막 구입 후 2~4개월</span></h2>
    <div class="list">${rebuy.length ? rebuy.map((c) => custItem(c, `${daysAgo(c.lastBuy)}일 전 구입`)).join('') : '<div class="empty">지금은 없어요</div>'}</div>
  </section>

  ${solar.length ? `<section class="card"><h2>양력 생일 확인 필요 <span class="sub">음력으로 적은 고객 · 양력으로 바꿔 넣으면 별자리가 나와요</span></h2>
    <div class="list">${solar.map((c) => custItem(c, esc(c.raw))).join('')}</div></section>` : ''}

  ${expired.length ? `<section class="card"><h2>보관 기간 지남 <span class="sub">마지막 연락 1년 넘음 · 개인정보 파기 대상</span></h2>
    <div class="list">${expired.map((c) => custItem(c, `<span class="tag warn">${esc(c.last || c.first)}</span>`)).join('')}</div>
    <p class="hint">탈리 동의 문구: 상담 종료 후 1년 이내 파기. 고객을 열어 맨 아래 '고객 지우기'로 지울 수 있어요.</p></section>` : ''}

  <section class="card"><h2>별자리별 고객 <span class="sub">어떤 오일을 넉넉히 준비할지 참고하세요</span></h2>
    <div class="hbars num">${counts.map((x) => `<div class="hbar"><span>${symOf(x.name)} ${esc(x.name)}</span><span class="track"><i style="width:${x.n / maxN * 100}%"></i></span><span class="n">${x.n}</span></div>`).join('')}</div>
  </section>`;
}

function custView() {
  const q = S.q.trim().toLowerCase();
  const qd = q.replace(/\D/g, '');
  const list = S.d.customers
    .filter((c) => S.status === '전체' || c.status === S.status)
    .filter((c) => !q || [c.name, c.sign, c.oil, c.memo, c.src].join(' ').toLowerCase().includes(q) || (qd.length >= 3 && c.tel.replace(/\D/g, '').includes(qd)))
    .sort((a, b) => (b.last || '').localeCompare(a.last || '') || a.name.localeCompare(b.name));
  return `<section class="card">
    <h2>고객 <span class="sub">${list.length}명</span><span class="right"><button class="btn gold sm" type="button" data-new>+ 고객 추가</button></span></h2>
    <input id="q" class="search" type="search" placeholder="이름 · 연락처 · 별자리 · 오일로 찾기" value="${esc(S.q)}">
    <div class="seg" role="group" aria-label="상태">${['전체', ...STATUSES].map((s) => `<button type="button" data-status="${s}" aria-pressed="${S.status === s}">${s}</button>`).join('')}</div>
    <div class="list" style="margin-top:8px">${list.length ? list.map((c) => custItem(c, c.last ? `최근 연락<br>${esc(c.last)}` : '')).join('') : '<div class="empty">조건에 맞는 고객이 없어요</div>'}</div>
  </section>`;
}

function inqCard(q) {
  const c = custById(q.cust);
  return `<div class="inq">
    <div class="inq-top"><b>${esc(q.name)}</b>${c && c.sign && c.sign !== NEED_SOLAR ? `<span class="tag">${symOf(c.sign)} ${esc(c.sign)}</span>` : ''}<span class="tag ${q.state === '새 문의' ? 'new' : ''}">${esc(q.state)}</span><span class="at">${esc(q.at)}</span></div>
    <p><b>${esc(q.program || '문의')}</b>${q.wish ? ` · 희망 ${esc(q.wish)}` : ''}${q.tel ? ` · <a href="tel:${esc(q.tel.replace(/[^\d+]/g, ''))}">${esc(q.tel)}</a>` : ''}</p>
    ${q.msg ? `<p>${esc(q.msg)}</p>` : ''}
    ${q.note ? `<p class="note">체험 결과: ${esc(q.note)}</p>` : ''}
    <div class="inq-act">
      ${INQ_STATES.filter((s) => s !== q.state).map((s) => `<button class="btn ${s === '연락함' ? 'navy' : 'ghost'} sm" type="button" data-inq="${esc(q.id)}" data-state="${s}">${s === '새 문의' ? '새 문의로 되돌리기' : s}</button>`).join('')}
      ${c ? `<button class="btn ghost sm" type="button" data-cust="${esc(c.id)}">고객 보기</button>` : ''}
    </div></div>`;
}

function inqView() {
  const list = S.d.inquiries.filter((q) => S.inqState === '전체' || q.state === S.inqState).sort((a, b) => b.at.localeCompare(a.at));
  return `<section class="card">
    <h2>문의 <span class="sub">${list.length}건</span><span class="right"><button class="btn ghost sm" type="button" data-import>탈리 문의 가져오기</button></span></h2>
    <div class="seg" role="group" aria-label="처리">${[...INQ_STATES, '전체'].map((s) => `<button type="button" data-istate="${s}" aria-pressed="${S.inqState === s}">${s}</button>`).join('')}</div>
    <div style="margin-top:12px">${list.length ? list.map(inqCard).join('') : '<div class="empty">문의가 없어요</div>'}</div>
  </section>`;
}

function setView() {
  return `<section class="card"><h2>탈리 연결</h2>
    <label class="field"><span>탈리 응답 시트 주소</span><input id="tallyUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(S.d.tallyUrl)}"></label>
    <div class="row" style="margin-top:10px"><button class="btn navy" type="button" data-saveurl>주소 저장</button><button class="btn ghost" type="button" data-import>지금 가져오기</button></div>
    <p class="hint">마지막 가져오기: ${esc(S.d.lastImport || '아직 없음')}</p>
  </section>
  <section class="card"><h2>자동 가져오기</h2>
    <div class="row"><span style="flex:1">15분마다 새 문의를 가져와요.</span>
      <button class="btn ${S.d.autoImport ? 'ghost' : 'gold'}" type="button" data-auto="${S.d.autoImport ? '0' : '1'}">${S.d.autoImport ? '끄기' : '켜기'}</button></div>
    <p class="hint">지금: <b>${S.d.autoImport ? '켜짐' : '꺼짐'}</b> · 웹앱을 열 때도 한 번씩 가져와요.</p>
  </section>
  <section class="card"><h2>탈리 응답 시트 만드는 법</h2>
    <ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.8">
      <li>tally.so → '훼이맵 상담 · 예약 신청' 폼 → <b>Integrations</b></li>
      <li><b>Google Sheets → Connect</b> → 이 고객관리 시트와 같은 구글 계정 선택</li>
      <li>탈리가 만든 구글 시트를 열고, 주소창의 주소를 복사해 위 칸에 붙여 넣기</li>
    </ol>
    <p class="hint">이미 들어온 문의는 다시 가져오지 않아요(Submission ID로 구분). 같은 연락처면 같은 고객으로 묶여요.</p>
  </section>`;
}

// ---------- 고객 창 ----------
function zodiacBox(birth, c) {
  const z = zodiacOf(birth);
  if (z) return `<div class="zodiac"><span class="big">${z[1]}</span><span><b>${z[0]} · ${z[3]}</b><small>${z[4]}</small></span></div>`;
  if (c && c.cal === '음력') return `<div class="zodiac warn"><span class="big">!</span><span><b>음력 생일이에요 (${esc(c.raw)})</b><small>양력으로 바꿔 위 칸에 넣으면 별자리 · 오일이 나와요</small></span></div>`;
  return `<div class="zodiac off"><span class="big">✦</span><span><b>생일을 넣으면</b><small>별자리와 추천 오일이 바로 나와요</small></span></div>`;
}

function openCustomer(id) {
  const c = id ? custById(id) : { id: '', name: '', tel: '', birth: '', cal: '양력', raw: '', btime: '', place: '', src: '', status: '신규 문의', memo: '', buys: '' };
  if (!c) return;
  const inqs = id ? S.d.inquiries.filter((q) => q.cust === id).sort((a, b) => b.at.localeCompare(a.at)) : [];
  const buys = c.buys ? c.buys.split('\n').filter(Boolean).reverse() : [];
  $('dlgTitle').textContent = id ? `${c.name} (${c.id})` : '새 고객';
  $('dlgBody').innerHTML = `
  <form class="sec" id="custForm">
    <div class="grid">
      <label class="field"><span>이름 *</span><input name="name" required value="${esc(c.name)}" autocomplete="off"></label>
      <label class="field"><span>연락처</span><input name="tel" type="tel" inputmode="tel" value="${esc(c.tel)}" placeholder="010-0000-0000"></label>
      <label class="field"><span>생일 (양력)</span><input name="birth" type="date" value="${esc(c.birth)}"></label>
      <label class="field"><span>상태</span><select name="status">${STATUSES.map((s) => `<option${s === c.status ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
      <div class="wide" id="zbox">${zodiacBox(c.birth, c)}</div>
      <label class="field"><span>태어난 시간</span><input name="btime" value="${esc(c.btime)}" placeholder="예: 14:30"></label>
      <label class="field"><span>출생지</span><input name="place" value="${esc(c.place)}"></label>
      <label class="field wide"><span>알게 된 경로</span><input name="src" list="srcList" value="${esc(c.src)}"><datalist id="srcList">${SOURCES.map((s) => `<option value="${s}">`).join('')}</datalist></label>
      <label class="field wide"><span>메모</span><textarea name="memo" placeholder="좋아하는 향, 피하고 싶은 향, 컨디션 등">${esc(c.memo)}</textarea></label>
    </div>
    <button class="btn navy block" type="submit" style="margin-top:12px">${id ? '저장' : '고객 추가'}</button>
  </form>
  ${id ? `
  <form class="sec" id="buyForm"><h4>구입 기록</h4>
    <div class="row"><input name="date" type="date" value="${esc(S.d.today)}" style="max-width:150px"><input name="text" placeholder="예: 아로마테라피 20 · 199,000원"><button class="btn gold" type="submit">추가</button></div>
    ${buys.length ? `<ul class="buys num">${buys.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : '<p class="hint">아직 구입 기록이 없어요.</p>'}
  </form>
  <div class="sec"><h4>문의 기록 <span class="sub" style="font-weight:500;color:var(--muted);font-size:12px">${inqs.length}건</span></h4>
    ${inqs.length ? inqs.map((q) => `<div class="inq"><div class="inq-top"><b>${esc(q.program || '문의')}</b><span class="tag ${q.state === '새 문의' ? 'new' : ''}">${esc(q.state)}</span><span class="at">${esc(q.at)}</span></div>${q.msg ? `<p>${esc(q.msg)}</p>` : ''}${q.note ? `<p class="note">체험 결과: ${esc(q.note)}</p>` : ''}</div>`).join('') : '<p class="hint" style="margin:0">문의 기록이 없어요.</p>'}
    <p class="hint">첫 문의 ${esc(c.first || '—')} · 최근 연락 ${esc(c.last || '—')}${c.lastBuy ? ' · 최근 구입 ' + esc(c.lastBuy) : ''}</p>
  </div>
  <button class="btn danger" type="button" data-del="${esc(c.id)}">고객 지우기</button>` : ''}`;

  const f = $('custForm');
  f.birth.addEventListener('input', () => { $('zbox').innerHTML = zodiacBox(f.birth.value, c); });
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    const data = Object.fromEntries(new FormData(f)); data.id = c.id;
    api('saveCustomer', data).then((newId) => reload().then(() => { toast(id ? '저장했어요' : '고객을 추가했어요'); openCustomer(newId); }))
      .catch(fail).finally(() => { btn.disabled = false; });
  });
  if (id) {
    const b = $('buyForm');
    b.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = b.querySelector('[type=submit]'); btn.disabled = true;
      api('addPurchase', id, b.date.value, b.text.value).then(() => reload().then(() => { toast('구입 기록을 추가했어요'); openCustomer(id); }))
        .catch(fail).finally(() => { btn.disabled = false; });
    });
  }
  if (!$('dlg').open) $('dlg').showModal();
}

// ---------- 동작 ----------
function reload() { return api('getCrmData').then((d) => { S.d = d; render(); }); }

function importNow(quiet) {
  return api('importTally').then((r) => {
    if (r.added || !quiet) toast(r.added ? `새 문의 ${r.added}건 (새 고객 ${r.newCustomers}명)` : '새 문의가 없어요');
    return reload();
  }).catch((e) => { if (!quiet) fail(e); });
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-cust]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute('data-close')) { $('dlg').close(); return; }
  if (t.dataset.cust) { openCustomer(t.dataset.cust); return; }
  if (t.hasAttribute('data-new')) { openCustomer(''); return; }
  if (t.dataset.status) { S.status = t.dataset.status; render(); return; }
  if (t.dataset.istate) { S.inqState = t.dataset.istate; render(); return; }
  if (t.dataset.inq) {
    t.disabled = true;
    api('setInquiryState', t.dataset.inq, t.dataset.state).then(() => reload().then(() => toast(`'${t.dataset.state}'으로 바꿨어요`))).catch(fail);
    return;
  }
  if (t.hasAttribute('data-import')) { t.disabled = true; importNow(false).finally(() => { t.disabled = false; }); return; }
  if (t.hasAttribute('data-saveurl')) {
    t.disabled = true;
    api('setTallyUrl', $('tallyUrl').value).then(() => reload().then(() => toast('주소를 저장했어요'))).catch(fail).finally(() => { t.disabled = false; });
    return;
  }
  if (t.dataset.auto) {
    t.disabled = true;
    api('setAutoImport', t.dataset.auto === '1').then((on) => reload().then(() => toast(on ? '자동 가져오기를 켰어요' : '자동 가져오기를 껐어요'))).catch(fail);
    return;
  }
  if (t.dataset.del) {
    const c = custById(t.dataset.del);
    if (!c || !confirm(`${c.name} 고객과 문의 기록을 모두 지울까요? 되돌릴 수 없어요.`)) return;
    api('deleteCustomer', c.id, c.name).then(() => { $('dlg').close(); return reload().then(() => toast('고객을 지웠어요')); }).catch(fail);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; S._focusSearch = true; render(); }
});
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });

// ---------- 데모 데이터 (Index.html을 브라우저로 그냥 열었을 때) ----------
const DEMO = (() => {
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const ago = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return fmt(d); };
  const soon = (n, year) => { const d = new Date(); d.setDate(d.getDate() + n); return `${year}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const sign = (b, cal) => { const z = zodiacOf(b); return z ? { sign: z[0], oil: z[3], kw: z[4] } : { sign: cal === '음력' ? NEED_SOLAR : '', oil: '', kw: '' }; };
  const mk = (o) => Object.assign({ tel: '', birth: '', cal: '양력', raw: '', btime: '', place: '', src: '', status: '신규 문의', first: ago(3), last: ago(3), lastBuy: '', buys: '', memo: '' }, o, sign(o.birth || '', o.cal));
  const d = {
    customers: [
      mk({ id: 'C0001', name: '김하늘', tel: '010-1234-5678', birth: soon(4, 1988), src: '인스타그램', status: '구매 고객', first: ago(150), last: ago(80), lastBuy: ago(80), buys: ago(80) + ' 아로마테라피 20 · 199,000원', memo: '라벤더 좋아함, 민트 계열은 두통' }),
      mk({ id: 'C0002', name: '이바다', tel: '010-2222-3333', birth: '1992-03-20', src: '네이버 블로그', status: '상담중', first: ago(10), last: ago(2) }),
      mk({ id: 'C0003', name: '박숲', tel: '010-4444-5555', cal: '음력', raw: '음력 1985-11-03', src: '지인 소개', first: ago(1), last: ago(1) }),
      mk({ id: 'C0004', name: '최별', tel: '010-6666-7777', birth: '1979-08-30', src: '유튜브', status: '구매 고객', first: ago(200), last: ago(95), lastBuy: ago(95), buys: ago(95) + ' 처녀자리 라벤더 10ml' }),
      mk({ id: 'C0005', name: '정달', tel: '010-8888-9999', birth: '1990-12-25', src: '스레드', status: '휴면', first: ago(420), last: ago(400) })
    ],
    inquiries: [
      { id: 'demo-1', at: ago(0) + ' 10:12', cust: 'C0003', name: '박숲', tel: '010-4444-5555', program: '정식 오행 사주 리포트', wish: soon(7, new Date().getFullYear()), msg: '음력 생일이에요. 시간은 새벽 5시쯤.', note: '', state: '새 문의' },
      { id: 'demo-2', at: ago(2) + ' 21:40', cust: 'C0002', name: '이바다', tel: '010-2222-3333', program: '1:1 오행·별자리 아로마 컨설팅', wish: '', msg: '잠들기 어려워요.', note: '향기카드 12 물고기자리 · 프랑킨센스 카드를 뽑았어요. 이 향으로 상담받고 싶어요.', state: '새 문의' },
      { id: 'demo-3', at: ago(10) + ' 14:05', cust: 'C0002', name: '이바다', tel: '010-2222-3333', program: '제품 · 기타 문의', wish: '', msg: '선물용 포장 되나요?', note: '', state: '완료' }
    ],
    tallyUrl: '', lastImport: '', autoImport: false, today: fmt(new Date())
  };
  let seq = 6;
  const find = (id) => d.customers.find((c) => c.id === id);
  return {
    getCrmData: () => JSON.parse(JSON.stringify(d)),
    saveCustomer: (c) => {
      if (!String(c.name || '').trim()) throw new Error('이름을 입력하세요.');
      let r = c.id ? find(c.id) : null;
      if (!r) { r = mk({ id: 'C' + String(seq++).padStart(4, '0'), name: '', first: d.today, last: d.today }); d.customers.push(r); }
      Object.assign(r, { name: c.name.trim(), tel: c.tel, birth: c.birth, btime: c.btime, place: c.place, src: c.src, status: c.status, memo: c.memo }, sign(c.birth, r.cal));
      if (c.birth && r.cal !== '음력') r.raw = c.birth;
      return r.id;
    },
    addPurchase: (id, date, text) => {
      if (!date || !String(text).trim()) throw new Error('날짜와 내용을 입력하세요.');
      const r = find(id);
      r.buys = (r.buys ? r.buys + '\n' : '') + date + ' ' + text.trim();
      if (date > r.lastBuy) r.lastBuy = date;
      if (date > r.last) r.last = date;
      r.status = '구매 고객';
      return true;
    },
    deleteCustomer: (id) => { d.customers = d.customers.filter((c) => c.id !== id); d.inquiries = d.inquiries.filter((q) => q.cust !== id); return true; },
    setInquiryState: (id, s) => {
      const q = d.inquiries.find((x) => x.id === id); q.state = s;
      const c = find(q.cust); if (c && s !== '새 문의') { c.last = d.today; if (c.status === '신규 문의') c.status = '상담중'; }
      return true;
    },
    setTallyUrl: (u) => { d.tallyUrl = u; return u; },
    importTally: () => { if (!d.tallyUrl) throw new Error('[설정]에 탈리 응답 시트 주소를 먼저 넣어 주세요.'); d.lastImport = d.today + ' 12:00'; return { added: 0, newCustomers: 0 }; },
    setAutoImport: (on) => { d.autoImport = on; return on; }
  };
})();

// ---------- 시작 ----------
if (S.demo) $('demoBar').classList.remove('hide');
else api('appUrl').then((u) => { $('toLedger').href = u; }).catch(() => {});
reload().then(() => { if (!S.demo && S.d.tallyUrl) importNow(true); })
  .catch((e) => { $('main').innerHTML = `<div class="card"><b>불러오지 못했어요</b><p class="hint">${esc((e && e.message) || e)}</p></div>`; });
</script>
</body>
</html>
