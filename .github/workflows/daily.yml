name: 훼이맵 공고 메일

on:
  # 아침 실행은 Claude 예약 작업이 매일 06:52 KST에 workflow_dispatch(force=false)로 시작한다.
  # GitHub 예약 실행은 1~3시간씩 밀려 아래 두 회차는 예비용이다.
  # 메일은 하루 한 번만 가고(seen.json의 lastSent), 기업마당 접속이 실패하면 다음 회차에서 다시 시도한다.
  # 마지막 회차(09:37 KST)에서도 실패하면 실패 안내 메일을 보낸다.
  schedule:
    - cron: '37 22 * * *' # 07:37 KST (예비)
    - cron: '37 0 * * *'  # 09:37 KST (예비·마지막 회차)
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 이미 보냈어도 다시 보내기'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hwaymap-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 공고 수집 및 메일 발송
        run: node src/index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          NAVER_SMTP_USER: ${{ secrets.NAVER_SMTP_USER }}
          NAVER_SMTP_PASS: ${{ secrets.NAVER_SMTP_PASS }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          FINAL_ATTEMPT: ${{ github.event.schedule == '37 0 * * *' && '1' || '' }}

      - name: seen.json·notices.json 커밋
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "공고 데이터 갱신 ($(TZ=Asia/Seoul date +%F))"
          # 그사이 다른 커밋이 올라왔어도 밀어 넣을 수 있게 먼저 받아온다.
          git pull --rebase origin main
          git push
