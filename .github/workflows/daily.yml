name: 훼이맵 공고 메일

on:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST (UTC 22:00). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hwaymap-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 공고 수집 및 메일 발송
        run: node src/index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          NAVER_SMTP_USER: ${{ secrets.NAVER_SMTP_USER }}
          NAVER_SMTP_PASS: ${{ secrets.NAVER_SMTP_PASS }}

      - name: seen.json·notices.json 커밋
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "공고 데이터 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
