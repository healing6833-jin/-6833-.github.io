<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>훼이맵 지원공고</title>
<meta name="theme-color" content="#1D2147">
<link rel="icon" href="img/logo-sm.png">
<link rel="apple-touch-icon" href="img/logo-sm.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지원공고">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 홈페이지(style.css)와 같은 라이트 베이지·남색·금색 톤 */
  :root{
    --bg:#F5EEE3; --surface:#FFFCF7; --surface-2:#F2EADD;
    --text:#24212C; --muted:#6B6472; --border:#E3D7C3;
    --navy:#1D2147; --navy-ink:#ECE6F4; --gold:#A9843F; --gold-soft:#E7D4A4;
    --fire:#C1502B; --water:#2F5A72;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --radius:16px; --shadow:0 10px 30px rgba(29,33,71,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-text-size-adjust:100%}
  header{background:var(--navy);color:var(--navy-ink);padding:22px 16px 18px}
  .wrap{max-width:720px;margin:0 auto}
  h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
  h1 span{color:var(--gold-soft)}
  .updated{margin:4px 0 0;font-size:.85rem;opacity:.8}
  main{padding:16px}
  .chips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
  .count{margin:0 0 10px;color:var(--muted);font-size:.9rem}
  .list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .badge{font-size:.78rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
  .badge.urgent{background:var(--fire);color:#fff}
  .badge.soon{background:var(--gold-soft);color:#5A4520}
  .badge.fit-상{background:var(--water);color:#fff}
  .badge.fit-중{background:var(--surface-2);color:var(--water)}
  .badge.new{background:var(--gold);color:#fff}
  .title{margin:0 0 6px;font-size:1.05rem;font-weight:700;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
  .meta{margin:0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
  .reason{margin:10px 0 0;font-size:.93rem;padding:10px 12px;background:var(--surface-2);border-radius:10px}
  .go{display:inline-block;margin-top:12px;background:var(--gold);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;border-radius:10px;padding:9px 16px}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
  footer{max-width:720px;margin:8px auto 32px;padding:0 16px;color:var(--muted);font-size:.8rem}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>훼이맵 <span>지원공고</span></h1>
    <p class="updated" id="updated">불러오는 중…</p>
  </div>
</header>
<main class="wrap">
  <div class="chips" role="group" aria-label="적합도 거르기">
    <button class="chip" type="button" data-fit="all" aria-pressed="true">전체</button>
    <button class="chip" type="button" data-fit="상" aria-pressed="false">적합도 상</button>
    <button class="chip" type="button" data-fit="중" aria-pressed="false">적합도 중</button>
  </div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>
</main>
<footer>
  매일 오전 7시쯤 기업마당 공고를 자동으로 모아 갱신합니다. 신청 전 반드시 원문 공고에서 자격과 일정을 확인하세요.
</footer>
<script>
(function () {
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var updatedEl = document.getElementById('updated');
  var items = [];
  var fitFilter = 'all';
  var today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());

  try { fitFilter = localStorage.getItem('hwaymap-fit') || 'all'; } catch (e) {}

  function dday(deadline) {
    if (!deadline) return null;
    return Math.round((Date.parse(deadline) - Date.parse(today)) / 86400000);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }

  function render() {
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.fit === fitFilter));
    });
    var shown = items.filter(function (it) {
      var d = dday(it.deadline);
      return (d === null || d >= 0) && (fitFilter === 'all' || it.fit === fitFilter);
    });
    listEl.textContent = '';
    countEl.textContent = '모집 중인 공고 ' + shown.length + '건 · 마감 임박순';
    if (!shown.length) {
      listEl.appendChild(el('li', 'empty', '지금 볼 수 있는 공고가 없습니다.'));
      return;
    }
    shown.forEach(function (it) {
      var li = el('li', 'card');
      var badges = el('div', 'badges');
      var d = dday(it.deadline);
      if (d === null) badges.appendChild(el('span', 'badge', '상시·마감 미정'));
      else if (d === 0) badges.appendChild(el('span', 'badge urgent', '오늘 마감'));
      else badges.appendChild(el('span', 'badge ' + (d <= 3 ? 'urgent' : d <= 7 ? 'soon' : ''), 'D-' + d));
      if (it.fit) badges.appendChild(el('span', 'badge fit-' + it.fit, '적합도 ' + it.fit));
      if (it.added === today) badges.appendChild(el('span', 'badge new', '오늘 추가'));
      li.appendChild(badges);
      li.appendChild(el('h2', 'title', it.title));
      li.appendChild(el('p', 'meta', (it.org || '기관 정보 없음') + (it.deadline ? ' · 마감 ' + it.deadline : '')));
      if (it.reason) li.appendChild(el('p', 'reason', it.reason));
      if (/^https?:\/\//.test(it.url || '')) {
        var a = el('a', 'go', '공고 보기');
        a.href = it.url;
        a.target = '_blank';
        a.rel = 'noopener';
        li.appendChild(a);
      }
      listEl.appendChild(li);
    });
  }

  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      fitFilter = c.dataset.fit;
      try { localStorage.setItem('hwaymap-fit', fitFilter); } catch (e) {}
      render();
    });
  });

  fetch('data/notices.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    })
    .then(function (data) {
      items = (data.items || []).slice().sort(function (a, b) {
        if (!a.deadline) return b.deadline ? 1 : 0;
        if (!b.deadline) return -1;
        return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
      });
      updatedEl.textContent = data.updated ? data.updated + ' 갱신' : '아직 모은 공고가 없습니다';
      render();
    })
    .catch(function () {
      updatedEl.textContent = '공고 목록을 불러오지 못했습니다';
      listEl.textContent = '';
      listEl.appendChild(el('li', 'empty', '잠시 후 다시 열어 주세요.'));
    });
})();
</script>
</body>
</html>
