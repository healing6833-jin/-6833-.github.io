<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발행 일정 · 훼이맵 SNS 스튜디오</title>
<link rel="stylesheet" href="common.css">
<style>
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 14px; }
  .day.today { border: 2px solid var(--accent); }
  .day .name { font-weight: 700; }
  .day .type { color: var(--accent); font-weight: 600; margin: 4px 0; }
  .day .ex { color: var(--muted); font-size: 13px; }
  @media (max-width: 760px) { .week { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <h1>🗓️ 발행 일정</h1>
    <a class="home-btn" href="index.html">🏠 HOME</a>
  </header>

  <div class="card">
    <h2>요일별 주제</h2>
    <p class="muted" style="margin-top:0">오늘은 테두리로 표시됩니다.</p>
    <div class="week" id="week"></div>
  </div>

  <div class="card">
    <h2>채널별 발행 시간</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>채널</th><th>시간</th><th>형식</th><th>글자 수 한도</th></tr></thead>
        <tbody id="times"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  // SNS·GEO 지침의 요일별 질문 유형 (getDay() 순서: 일요일이 0)
  const WEEK = [
    { name: "일", type: "쉬는 날", ex: "다음 주 질문 고르기, AI 검색 노출 점검" },
    { name: "월", type: "입문", ex: "아로마테라피는 무엇이고 어떻게 시작하나요?" },
    { name: "화", type: "상황", ex: "잠들기 전 어울리는 에센셜 오일은?" },
    { name: "수", type: "별자리 · 행성", ex: "사자자리에 어울리는 향은 무엇인가요?" },
    { name: "목", type: "비교", ex: "라벤더와 캐모마일은 어떻게 다른가요?" },
    { name: "금", type: "사용법 · 안전", ex: "에센셜 오일 희석 비율은 어떻게 하나요?" },
    { name: "토", type: "구매 · 선택", ex: "초보자는 어떤 오일부터 사면 좋을까요?" },
  ];
  const FORMAT = {
    instagram: "카드뉴스 6장 + 캡션",
    threads: "3개 연속 글",
    blog: "질문형 제목, 1,500자 + FAQ 3개",
    youtube: "세로 쇼츠 30~60초",
  };

  const today = new Date().getDay();
  // 월요일부터 보여 주기
  document.getElementById("week").innerHTML = [1, 2, 3, 4, 5, 6, 0].map((i) => {
    const d = WEEK[i];
    return `<div class="day ${i === today ? "today" : ""}"><div class="name">${d.name}요일</div>
      <div class="type">${d.type}</div><div class="ex">${d.ex}</div></div>`;
  }).join("");

  document.getElementById("times").innerHTML = CHANNELS.map((ch) =>
    `<tr><td>${ch.name}</td><td>${ch.time}</td><td>${FORMAT[ch.id]}</td><td>${ch.limit}자${ch.note ? ` (${ch.note})` : ""}</td></tr>`
  ).join("");
</script>
</body>
</html>
