<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 · 훼이맵 SNS 스튜디오</title>
<link rel="stylesheet" href="common.css">
<style>
  .check li { margin: 4px 0; }
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
  .counts div { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .counts b { display: block; font-size: 16px; }
  .over b { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <h1>✍️ 글쓰기</h1>
    <a class="home-btn" href="index.html">🏠 HOME</a>
  </header>

  <div class="card">
    <h2>오늘의 글</h2>
    <label for="question">오늘의 질문</label>
    <input type="text" id="question" placeholder="예: 잠들기 전 어울리는 에센셜 오일은?">

    <label for="body">본문 (첫 문장은 질문에 대한 직접 답으로)</label>
    <textarea id="body" placeholder="예: 잠들기 전에는 라벤더처럼 편안한 분위기를 만드는 향이 어울립니다."></textarea>

    <label for="tags">해시태그 (띄어쓰기로 구분, 8개 이하)</label>
    <input type="text" id="tags" placeholder="#아로마테라피 #에센셜오일 #훼이맵">

    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="add-brand" type="button">브랜드 소개 문장 넣기</button>
      <button class="btn" id="save" type="button">저장하고 미리보기 →</button>
    </div>
  </div>

  <div class="card">
    <h2>자동 검사</h2>
    <ul class="check" id="check"></ul>
    <p class="muted" style="margin:12px 0 0">채널별 글자 수 (질문 + 본문 + 해시태그 기준)</p>
    <div class="counts" id="counts"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const $q = document.getElementById("question");
  const $body = document.getElementById("body");
  const $tags = document.getElementById("tags");

  function fullText() {
    return [$q.value, $body.value, $tags.value].join("\n\n");
  }

  function render() {
    const text = fullText();
    const banned = findBanned(text);
    const tagCount = $tags.value.split(/\s+/).filter((t) => t.startsWith("#")).length;
    const items = [
      [$q.value.trim() !== "", "오늘의 질문 입력"],
      [banned.length === 0, banned.length ? `금지 표현 발견: ${banned.join(", ")}` : "금지 표현 없음"],
      [$body.value.includes(BRAND_LINE), "브랜드 소개 문장 포함"],
      [tagCount <= 8, `해시태그 ${tagCount}개 (8개 이하)`],
    ];
    document.getElementById("check").innerHTML = items
      .map(([ok, label]) => `<li><span class="tag ${ok ? "ok" : "warn"}">${ok ? "통과" : "확인"}</span> ${escapeHtml(label)}</li>`)
      .join("");

    document.getElementById("counts").innerHTML = CHANNELS.map((ch) => {
      const len = ch.id === "youtube" ? $q.value.length : text.length;
      return `<div class="${len > ch.limit ? "over" : ""}">${ch.name}<b>${len} / ${ch.limit}</b>${ch.note || ""}</div>`;
    }).join("");
  }

  document.getElementById("add-brand").addEventListener("click", () => {
    if (!$body.value.includes(BRAND_LINE)) {
      $body.value = $body.value.trimEnd() + "\n\n" + BRAND_LINE + "\n" + HOMEPAGE;
      render();
    }
  });

  document.getElementById("save").addEventListener("click", () => {
    if (!$q.value.trim() || !$body.value.trim()) return toast("질문과 본문을 입력해 주세요");
    const banned = findBanned(fullText());
    if (banned.length) return toast(`금지 표현을 먼저 고쳐 주세요: ${banned.join(", ")}`);
    const posts = loadPosts();
    posts.unshift({
      id: Date.now(),
      date: new Date().toISOString().slice(0, 10),
      question: $q.value.trim(),
      body: $body.value.trim(),
      tags: $tags.value.trim(),
      done: {},
    });
    savePosts(posts);
    location.href = "preview.html";
  });

  [$q, $body, $tags].forEach((el) => el.addEventListener("input", render));
  render();
</script>
</body>
</html>
